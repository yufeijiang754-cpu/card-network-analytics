version: 2

models:
  - name: dq_transaction_quarantine
    description: >
      Work queue of authorization records excluded from the trusted marts because of a
      blocking data-quality issue, with the violated rules and the team responsible for the fix.
    meta: {owner: "Data Quality", layer: dq, grain: "one row per quarantined raw record"}
    columns:
      - name: transaction_id
        description: "Authorization identifier as received."
      - name: load_date
        description: "Ingestion date."
      - name: loaded_at
        description: "{{ doc('loaded_at') }}"
      - name: transaction_ts
        description: "Event timestamp as received."
      - name: card_id
        description: "Card identifier as received."
      - name: merchant_id
        description: "Merchant identifier as received."
      - name: issuer_id
        description: "Issuer identifier as received."
      - name: acquirer_id
        description: "Acquirer identifier as received."
      - name: amount_local
        description: "Amount as received."
      - name: currency_raw
        description: "Currency as received."
      - name: channel
        description: "Channel as received."
      - name: auth_response_code
        description: "Response code as received."
      - name: is_approved
        description: "Approval flag as received."
      - name: dq_issues
        description: "{{ doc('dq_issues') }}"
      - name: remediation_owner
        description: "Team accountable for fixing the root cause (reference data, switch engineering, or upstream feed owner)."

  - name: dq_daily_partition_metrics
    description: >
      Row-level DQ rule results aggregated per daily ingestion partition. pass_rate = 1 - failed_rows / total_rows.
      Used for trend monitoring; see docs/DATA_QUALITY_SCORECARD.md for thresholds.
    meta: {owner: "Data Quality", layer: dq, grain: "load_date x check_name"}
    data_tests:
      - dq_unique_combination:
          columns: ['load_date', 'check_name']
    columns:
      - name: load_date
        description: "Ingestion date (partition)."
      - name: dq_dimension
        description: "DQ dimension: completeness, uniqueness, validity, timeliness, referential_integrity, consistency."
      - name: check_name
        description: "Name of the row-level rule."
      - name: total_rows
        description: "Records ingested in the partition."
      - name: failed_rows
        description: "Records violating the rule."
      - name: pass_rate
        description: "1 - failed_rows / total_rows."
        data_tests:
          - dq_value_in_range: {min_value: 0, max_value: 1}
